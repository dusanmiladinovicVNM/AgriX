<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriX Otkup — Video toka</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}#vroot{position:fixed;inset:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="vroot" data-screen-label="video @ 0s"></div>
<script type="text/babel">
const cfg = {
  key: 'otkup-video',
  role: 'Otkup',
  screensSrc: 'screens-otkup.html',
  logo: 'img/AgriX-Otkup-Logo-Final.png',
  outroLogo: 'img/AgriX-Logo-Final_Novi.png',
  introEyebrow: 'AgriX Otkup',
  introTitle: 'Jedan otkup — od QR-a<br>do <span style="color:#C8A84B;font-style:italic">zbirne otpremnice</span>.',

  introVO: 'AgriX Otkup — od skeniranja kooperanta do zbirne otpremnice, bez papira.',
  outroTagline: 'Pisan iz hladnjače, za hladnjače.',
  outroVO: 'AgriX — ceo otkup pod kontrolom, od QR-a do banke.',
  steps: [
    { id: 'otkup-1', title: 'Sken kooperanta', desc: 'Otkupac skenira QR — sistem prepoznaje proizvođača, parcele i ugovorenu cenu.', vo: 'Otkupac skenira QR kooperanta — sistem odmah prepoznaje proizvođača, parcele i cenu.', tap: { type: 'scan' } },
